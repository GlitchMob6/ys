<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- SEO -->
  <title>Subscribe to Unlock Access</title>
  <meta name="description" content="Subscribe to our YouTube channel to unlock exclusive content access." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Main Gate Card ─── -->
  <main class="gate-card" role="main" aria-label="Subscription gate">

    <!-- Icon (updates per state) -->
    <span class="gate-icon" aria-hidden="true">🔒</span>

    <!-- Heading -->
    <h1 class="gate-title">Subscribe to Continue</h1>

    <!-- Description -->
    <p class="gate-desc">
      Subscribe to our YouTube channel to unlock your exclusive access.
    </p>

    <!-- Config error banner (hidden by default) -->
    <div class="error-banner" role="alert" aria-live="assertive"></div>

    <!-- Step indicator -->
    <div class="steps" aria-label="Progress">
      <span class="step-dot active" aria-label="Step 1"></span>
      <span class="step-dot" aria-label="Step 2"></span>
      <span class="step-dot" aria-label="Step 3"></span>
    </div>

    <!-- Subscribe button -->
    <div class="btn-wrapper subscribe-wrap visible">
      <button
        class="btn btn-subscribe"
        type="button"
        aria-label="Subscribe to YouTube channel"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.5 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
        </svg>
        Subscribe First
      </button>
    </div>

    <!-- Waiting indicator (shown while user is on YouTube) -->
    <div class="waiting-indicator" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span class="waiting-text">Subscribe on YouTube, then return here…</span>
    </div>

    <!-- Success badge -->
    <div class="success-badge" aria-live="polite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.5 14.3-3.8-3.8 1.4-1.4 2.4 2.4 5.6-5.6 1.4 1.4-7 7Z"/>
      </svg>
      Access Unlocked
    </div>

    <!-- Access button -->
    <div class="btn-wrapper access-wrap hidden">
      <button
        class="btn btn-access"
        type="button"
        aria-label="Access Google Drive content"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M5 20h14v-2H5v2Zm7-18L5.3 9h4.2v7h5V9h4.2L12 2Z"/>
        </svg>
        Click Here to Access
      </button>
    </div>

  </main>


  <!-- Scripts: config first, then app -->
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
